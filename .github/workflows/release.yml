name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Uses GITHUB_TOKEN, so CI does not run on the release PR by itself.
      # Packagist picks up the new tag through its GitHub webhook, so no publish job is needed.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Display release
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "::notice title=Release tag::${{ steps.release.outputs.tag_name }}"
          echo "::notice title=Release URL::${{ steps.release.outputs.html_url }}"
